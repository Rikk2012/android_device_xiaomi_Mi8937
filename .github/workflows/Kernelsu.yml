name: Kernelsu

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel for Riva
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            zip curl git libncurses5-dev ccache libxml2-utils lzop zlib1g-dev

      - name: Setup Toolchain (Proton Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          cd ..

      - name: Integrate KernelSU (slashxxx)
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Build Kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          if [ -f "arch/arm64/configs/msm8937-perf_defconfig" ]; then
            DEFCONFIG="msm8937-perf_defconfig"
          elif [ -f "arch/arm64/configs/msm8937_defconfig" ]; then
            DEFCONFIG="msm8937_defconfig"
          elif [ -f "arch/arm64/configs/riva_defconfig" ]; then
            DEFCONFIG="riva_defconfig"
          else
            DEFCONFIG=$(ls arch/arm64/configs/*8937* 2>/dev/null | head -n 1 | xargs -n 1 basename)
          fi

          echo "Menggunakan Defconfig: $DEFCONFIG"

          make O=out $DEFCONFIG

          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_KPROBES \
            -e CONFIG_HAVE_KPROBES \
            -e CONFIG_KPROBE_EVENTS

          make O=out olddefconfig

          make -j$(nproc --all) O=out

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel
          
          IMAGE_PATH=""
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            IMAGE_PATH="out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "out/arch/arm64/boot/Image-dtb" ]; then
            IMAGE_PATH="out/arch/arm64/boot/Image-dtb"
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            IMAGE_PATH="out/arch/arm64/boot/Image.gz"
          fi

          if [ -z "$IMAGE_PATH" ]; then
            exit 1
          fi

          cp "$IMAGE_PATH" anykernel/
          
          sed -i 's/device.name1=.*/device.name1=riva/g' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=rolex/g' anykernel/anykernel.sh

          cd anykernel
          zip -r9 ../KernelSU-slashxxx-Riva.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-slashxxx-Riva-Output
          path: KernelSU-slashxxx-Riva.zip
          
